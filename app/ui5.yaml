specVersion: '2.15'
metadata:
  name: neuroflow

type: application

server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      configuration:
        - path: /odata/v4
          target: http://localhost:4004
        - path: /auth
          target: http://localhost:4004

resources:
  configuration:
    paths:
      webapp: webapp

builder:
  resources:
    excludes:
      - test/**
